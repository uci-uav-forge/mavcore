[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mavcore"
version = "0.1.0"
description = "UAV Forge MAVLink communication library"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {mavcore = "."}
packages = ["mavcore", "mavcore.messages", "mavcore.protocols", "mavcore.mavtypes"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
